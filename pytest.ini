[pytest]
# Корень, где лежат тесты
testpaths = tests

# Шаблоны поиска файлов, классов и функций
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Стандартные флаги при каждом запуске
# -v: подробный вывод
# -s: разрешить print() внутри тестов (удобно при отладке)
# --strict-markers: запретить использовать незарегистрированные маркеры
addopts = -v -s --strict-markers --color=yes

# Регистрация маркеров (чтобы группировать тесты)
markers =
    unit: быстрые тесты логики (без БД)
    integration: тесты взаимодействия с БД или API
    slow: очень долгие тесты

# Настройка для работы с асинхронностью (ВАЖНО для FastAPI и aiogram)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Игнорирование определенных предупреждений (например, от сторонних библиотек)
filterwarnings =
    ignore::DeprecationWarning