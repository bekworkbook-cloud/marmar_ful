<!-- это страница отравляет пост на /webapp/reg запрос с init_data и бот который получил  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>



<script src="https://telegram.org/js/telegram-web-app.js"></script>
<div class="flex-1 flex flex-col items-center justify-center h-full fade-up">
    <div class="relative w-16 h-16 mb-6">
        <div class="absolute inset-0 rounded-full border-4 border-white/10"></div>
        <div class="absolute inset-0 rounded-full border-4 border-accent border-t-transparent animate-spin"></div>
    </div>
    
    <h1 class="text-xl font-semibold text-white mb-2">Авторизация...</h1>
    <p class="text-sm text-slate-400">Пожалуйста, подождите, мы проверяем ваши данные.</p>
</div>
<script>
    const tg = window.Telegram.WebApp;
    const init_data = window.Telegram.WebApp.initData;
    tg.expand();
    tg.setHeaderColor('secondary_bg_color');
    const user = tg.initDataUnsafe.user;

    fetch('/webapp/auth/courier_bot', {
        method: 'POST',
        headers: {
            'x-telegram-init-data': init_data
        }
    })
    .then(response => {
        if (response.ok) {
            window.location.href = "/webapp/app/courier_bot";
        } else {
            alert("Ошибка авторизации");
        }
    });
</script>

    
</body>
</html>
