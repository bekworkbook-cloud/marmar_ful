<!doctype html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование заказа</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Outfit', sans-serif; }
        body { background-color: #0f172a; color: #e2e8f0; }
        .fade-up { animation: fadeUp .4s ease both; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen">
    <div class="p-6 max-w-4xl mx-auto w-full mt-4 lg:mt-6">
        <button onclick="window.history.back()" class="inline-flex items-center gap-2 text-slate-400 hover:text-white mb-6 transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Назад
        </button>

        <div class="bg-card bg-[#1e293b] rounded-xl p-6 border border-white/5 shadow-2xl fade-up">
            <div class="flex items-center gap-3 mb-6 pb-4 border-b border-white/5">
                <div class="w-10 h-10 rounded-lg bg-accent/20 flex items-center justify-center">
                    <i data-lucide="edit-3" class="w-5 h-5 text-accent"></i>
                </div>
                <div>
                    <h2 class="text-xl font-semibold text-white">Редактирование заказа #<span id="order-id">...</span></h2>
                    <p class="text-sm text-slate-400">Установите "0", чтобы удалить товар.</p>
                </div>
            </div>

            <form id="edit-order-form">
                <div class="overflow-x-auto mb-6">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="text-slate-500 text-xs uppercase tracking-wider border-b border-white/5">
                                <th class="text-left pb-3 font-medium">Товар</th>
                                <th class="text-right pb-3 font-medium">Цена</th>
                                <th class="text-center pb-3 font-medium w-32">Количество</th>
                            </tr>
                        </thead>
                        <tbody id="items-tbody" class="divide-y divide-white/5">
                            </tbody>
                    </table>
                </div>

                <div class="pt-4 border-t border-white/5 flex items-center justify-between">
                    <p class="text-sm text-amber-400/80"><i data-lucide="info" class="w-4 h-4 inline-block mr-1"></i> Итого пересчитается на сервере.</p>
                    <button type="submit" class="bg-accent hover:bg-accent/90 text-surface font-semibold px-6 py-2.5 rounded-lg transition-colors flex items-center gap-2">
                        <i data-lucide="save" class="w-4 h-4"></i> Сохранить изменения
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order_id');
        const token = localStorage.getItem('jwt');

        async function loadOrder() {
            const response = await fetch(`/api/v1/orders/${orderId}/items`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            const tbody = document.getElementById('items-tbody');
            document.getElementById('order-id').textContent = orderId;

            tbody.innerHTML = data.order_items.map(item => `
                <tr class="text-slate-300">
                    <td class="py-4 font-medium text-white">Товар #${item.product_id}</td>
                    <td class="py-4 text-right">${item.price_at_purchase} сум</td>
                    <td class="py-4 text-center">
                        <input type="number" name="qty_${item.product_id}" value="${item.quantity}" min="0" 
                               class="w-20 text-center bg-surface border border-white/10 rounded-lg px-2 py-2 text-txt focus:border-accent outline-none">
                    </td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        document.getElementById('edit-order-form').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const items = [];
            
            // Собираем данные из инпутов
            for (let [name, value] of formData.entries()) {
                const productId = name.replace('qty_', '');
                items.push({ product_id: parseInt(productId), quantity: parseInt(value) });
            }

            // ТУТ ВАЖНО: Тебе нужно отправить это на твой эндпоинт обновления.
            // Если у тебя нет готового эндпоинта под этот массив, 
            // сервер нужно будет дописать.
            console.log("Отправляем состав:", items);
            alert("Функция сохранения требует реализации эндпоинта на бэкенде!");
        };

        document.addEventListener('DOMContentLoaded', loadOrder);
    </script>
</body>
</html>
