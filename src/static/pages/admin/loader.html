<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация...</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="status">Подключение к серверу...</div>
<script>
    async function authenticate() {
        const initData = window.Telegram.WebApp.initData;
        if (!initData) {
            document.getElementById('status').innerText = 'Ошибка: приложение открыто вне Telegram';
            return;
        }
        try {
            const response = await fetch('/api/v1/auth/init_data/admin_bot', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-telegram-init-data': initData
                }
            });
            if (!response.ok) throw new Error('Ошибка авторизации');
            const data = await response.json();
            localStorage.setItem('jwt', data.access_token);
            window.location.href = '/static/pages/admin/index.html';
        } catch (error) {
            document.getElementById('status').innerText = 'Ошибка соединения с сервером';
        }
    }
    authenticate();
</script>
</body>
</html>
