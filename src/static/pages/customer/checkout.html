<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            background: #111;
            color: white;
            font-family: sans-serif;
        }

        h1 {
            margin-bottom: 20px;
        }

        .section {
            background: #1f1f1f;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        input,
        textarea,
        select {
            width: 100%;
            margin-top: 8px;

            background: #2a2a2a;
            color: white;

            border: none;
            border-radius: 10px;

            padding: 12px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .submit-button {
            width: 100%;

            border: none;
            border-radius: 12px;

            background: #16a34a;
            color: white;

            padding: 14px;

            font-size: 16px;
            cursor: pointer;
        }

        .submit-button:hover {
            opacity: 0.9;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
        }

        .error {
            color: #ff6b6b;
            margin-top: 12px;
        }
    </style>
</head>
<body>

<h1>Оформление заказа</h1>

<div class="section">
    <h3>Товары</h3>

    <div id="cart-items"></div>

    <hr>

    <div class="total" id="total"></div>
</div>

<div class="section">

    <h3>Доставка</h3>

    <input
        id="address"
        type="text"
        placeholder="Адрес"
    >

    <textarea
        id="landmark"
        placeholder="Ориентир"
    ></textarea>

</div>

<div class="section">

    <h3>Оплата</h3>

    <select id="payment-method">
        <option value="cash">
            Наличными
        </option>

        <option value="card">
            Картой
        </option>
    </select>

</div>

<button
    class="submit-button"
    onclick="createOrder()"
>
    Создать заказ
</button>

<div id="error" class="error"></div>

<script>
const API_BASE = "/api/v1";

async function apiFetch(endpoint, options = {}) {
    const token = localStorage.getItem("jwt");

    const response = await fetch(`${API_BASE}${endpoint}`, {
        ...options,
        headers: {
            "Content-Type": "application/json",
            ...(options.headers || {}),
            "Authorization": `Bearer ${token}`
        }
    });

    if (response.status === 401) {
        localStorage.removeItem("jwt");

        window.location.href =
            "/static/pages/customer/loader.html";

        return null;
    }

    return response;
}

function getCart() {
    return JSON.parse(
        localStorage.getItem("cart")
    ) || [];
}

function formatPrice(price) {
    return `${Number(price).toLocaleString()} сум`;
}

function renderCart() {
    const cart = getCart();

    const container =
        document.getElementById("cart-items");

    const totalElement =
        document.getElementById("total");

    let total = 0;

    container.innerHTML = "";

    cart.forEach(item => {
        const itemTotal =
            Number(item.price) * item.quantity;

        total += itemTotal;

        const div = document.createElement("div");

        div.className = "cart-item";

        div.innerHTML = `
            <div>
                ${item.name}
                × ${item.quantity}
            </div>

            <div>
                ${formatPrice(itemTotal)}
            </div>
        `;

        container.appendChild(div);
    });

    totalElement.innerText =
        `Итого: ${formatPrice(total)}`;
}

async function createOrder() {
    const errorElement =
        document.getElementById("error");

    errorElement.innerText = "";

    try {
        const cart = getCart();

        if (!cart.length) {
            errorElement.innerText =
                "Корзина пуста";

            return;
        }

        const branchId =
            cart[0].branch_id;

        const address =
            document.getElementById("address")
                .value
                .trim();

        const landmark =
            document.getElementById("landmark")
                .value
                .trim();

        const paymentMethod =
            document.getElementById(
                "payment-method"
            ).value;

        if (!address) {
            errorElement.innerText =
                "Введите адрес";

            return;
        }

        const orderItems = cart.map(item => ({
            product_id: item.id,
            quantity: item.quantity
        }));

        const body = {
            branch_id: branchId,
            payment_method: paymentMethod,
            address: address,
            landmark: landmark,
            latitude: 0,
            longitude: 0,
            order_items: orderItems
        };

        const response = await apiFetch(
            "/orders/",
            {
                method: "POST",
                body: JSON.stringify(body)
            }
        );

        if (!response) {
            return;
        }

        if (!response.ok) {
            const errorData =
                await response.json();

            console.error(errorData);

            errorElement.innerText =
                "Ошибка создания заказа";

            return;
        }

        const order = await response.json();

        localStorage.removeItem("cart");

        window.location.href =
            `/static/pages/customer/order.html?id=${order.id}`;

    } catch (error) {
        console.error(error);

        errorElement.innerText =
            "Ошибка сети";
    }
}

renderCart();
</script>

</body>
</html>
