<!doctype html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no,
            viewport-fit=cover
        "
    >

    <title>Заказ</title>

    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link
        href="
            https://fonts.googleapis.com/css2?
            family=Outfit:wght@300;400;500;600;700&
            display=swap
        "
        rel="stylesheet"
    >

    <style>
        * {
            font-family: 'Outfit', sans-serif;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-up {
            animation: fadeUp .4s ease both;
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        surface: '#0f172a',
                        card: '#1e293b',
                        accent: '#f59e0b',
                        accentSoft: '#78350f',
                        txt: '#e2e8f0',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-surface text-txt">

<div class="
    min-h-screen
    flex
    flex-col
">

    <!-- HEADER -->
    <header class="
        sticky
        top-0
        z-10

        bg-surface/95
        backdrop-blur

        border-b
        border-slate-800

        px-5
        pt-[calc(env(safe-area-inset-top)+16px)]
        pb-4
    ">

        <div class="
            flex
            items-center
            justify-between
        ">

            <div>

                <h1 class="
                    text-3xl
                    font-bold
                ">
                    Заказ
                </h1>

                <div class="
                    text-sm
                    text-slate-400
                    mt-1
                ">
                    Информация о заказе
                </div>

            </div>

            <div class="
                w-14
                h-14
                rounded-2xl
                bg-accentSoft

                flex
                items-center
                justify-center
            ">
                <i
                    data-lucide="package"
                    class="w-7 h-7 text-accent"
                ></i>
            </div>

        </div>

    </header>

    <!-- CONTENT -->
    <main class="
        flex-1
        overflow-y-auto

        px-5
        py-5
        pb-[calc(env(safe-area-inset-bottom)+40px)]
    ">

        <div id="content" class="text-slate-400">
            Загрузка...
        </div>

    </main>

</div>

<script>
lucide.createIcons();

Telegram.WebApp.ready();
Telegram.WebApp.expand();

Telegram.WebApp.BackButton.show();

Telegram.WebApp.BackButton.onClick(() => {
    history.back();
});

const API_BASE = "/api/v1";

async function apiFetch(endpoint, options = {}) {

    const token =
        localStorage.getItem("jwt");

    const response = await fetch(
        `${API_BASE}${endpoint}`,
        {
            ...options,
            headers: {
                "Content-Type": "application/json",
                ...(options.headers || {}),
                "Authorization": `Bearer ${token}`
            }
        }
    );

    if (response.status === 401) {

        localStorage.removeItem("jwt");

        window.location.href =
            "/static/pages/customer/loader.html";

        return null;
    }

    return response;
}

function getOrderId() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("id");
}

function formatPrice(price) {

    return `
        ${Number(price).toLocaleString()}
        сум
    `;
}

function getStatusLabel(status) {

    const statuses = {
        pending: "Ожидает",
        accepted: "Принят",
        cooking: "Готовится",
        delivering: "Доставляется",
        completed: "Завершён",
        cancelled: "Отменён"
    };

    return statuses[status] || status;
}

function getStatusClasses(status) {

    const styles = {
        pending: `
            bg-yellow-500/20
            text-yellow-300
        `,

        accepted: `
            bg-blue-500/20
            text-blue-300
        `,

        cooking: `
            bg-purple-500/20
            text-purple-300
        `,

        delivering: `
            bg-cyan-500/20
            text-cyan-300
        `,

        completed: `
            bg-green-500/20
            text-green-300
        `,

        cancelled: `
            bg-red-500/20
            text-red-300
        `
    };

    return styles[status] || `
        bg-slate-700
        text-slate-300
    `;
}

async function loadOrder() {

    const content =
        document.getElementById("content");

    try {

        const orderId =
            getOrderId();

        if (!orderId) {

            content.innerHTML = `
                <div class="
                    bg-red-900/30
                    border
                    border-red-800
                    rounded-2xl
                    p-4
                    text-red-300
                ">
                    ID заказа не найден
                </div>
            `;

            return;
        }

        const orderResponse =
            await apiFetch(
                `/orders/${orderId}`
            );

        if (!orderResponse) {
            return;
        }

        const order =
            await orderResponse.json();

        const itemsResponse =
            await apiFetch(
                `/orders/${orderId}/items`
            );

        if (!itemsResponse) {
            return;
        }

        const itemsData =
            await itemsResponse.json();

        renderOrder(
            order,
            itemsData.order_items
        );

    } catch (error) {

        console.error(error);

        content.innerHTML = `
            <div class="
                bg-red-900/30
                border
                border-red-800
                rounded-2xl
                p-4
                text-red-300
            ">
                Ошибка загрузки заказа
            </div>
        `;
    }
}

function renderOrder(order, items) {

    const content =
        document.getElementById("content");

    const itemsHtml =
        items.map(item => `

            <div class="
                flex
                items-center
                justify-between

                gap-4

                bg-slate-800/70
                rounded-2xl

                p-4
            ">

                <div>

                    <div class="
                        text-lg
                        font-semibold
                    ">
                        Товар #${item.product_id}
                    </div>

                    <div class="
                        mt-1
                        text-sm
                        text-slate-400
                    ">
                        Количество:
                        ${item.quantity}
                    </div>

                </div>

                <div class="
                    text-lg
                    font-bold
                    text-accent
                    whitespace-nowrap
                ">
                    ${formatPrice(
                        item.price_at_purchase
                    )}
                </div>

            </div>

        `).join("");

    content.innerHTML = `

        <!-- ORDER INFO -->
        <div class="
            fade-up

            bg-card
            rounded-3xl

            border
            border-slate-800

            p-5
        ">

            <div class="
                flex
                items-start
                justify-between
                gap-4
            ">

                <div>

                    <div class="
                        text-2xl
                        font-bold
                    ">
                        Заказ #${order.id}
                    </div>

                    <div class="
                        mt-2
                        text-slate-400
                    ">
                        ${order.address}
                    </div>

                </div>

                <div class="
                    px-3
                    py-2

                    rounded-xl

                    text-xs
                    font-semibold

                    ${getStatusClasses(order.status)}
                ">
                    ${getStatusLabel(order.status)}
                </div>

            </div>

            <div class="
                mt-6

                flex
                flex-col
                gap-4
            ">

                <div class="
                    flex
                    items-center
                    justify-between
                ">

                    <div class="
                        text-slate-400
                    ">
                        Способ оплаты
                    </div>

                    <div class="
                        font-medium
                    ">
                        ${order.payment_method}
                    </div>

                </div>

                <div class="
                    flex
                    items-center
                    justify-between
                ">

                    <div class="
                        text-slate-400
                    ">
                        Сумма заказа
                    </div>

                    <div class="
                        text-2xl
                        font-bold
                        text-accent
                    ">
                        ${formatPrice(
                            order.total_price
                        )}
                    </div>

                </div>

            </div>

        </div>

        <!-- ITEMS -->
        <div class="
            fade-up

            mt-5

            bg-card
            rounded-3xl

            border
            border-slate-800

            p-5
        ">

            <div class="
                flex
                items-center
                justify-between
                mb-5
            ">

                <div class="
                    text-2xl
                    font-bold
                ">
                    Товары
                </div>

                <div class="
                    w-11
                    h-11

                    rounded-2xl
                    bg-accentSoft

                    flex
                    items-center
                    justify-center
                ">
                    <i
                        data-lucide="shopping-bag"
                        class="
                            w-5
                            h-5
                            text-accent
                        "
                    ></i>
                </div>

            </div>

            <div class="
                flex
                flex-col
                gap-3
            ">
                ${itemsHtml}
            </div>

        </div>
    `;

    lucide.createIcons();
}

loadOrder();
</script>

</body>
</html>
