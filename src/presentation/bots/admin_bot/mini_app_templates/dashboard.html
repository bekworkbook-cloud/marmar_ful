<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #0f0f10;
            color: #e4e6eb;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            color: #ffffff;
        }

        .card {
            background-color: #1c1c1e;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s ease;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card:hover {
            background-color: #232325;
        }

        .label {
            font-size: 16px;
            color: #a1a1aa;
        }

        .value {
            font-size: 20px;
            font-weight: 600;
            color: #4ea6ff;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Админ панель</h1>

    <div class="card">
        <div class="label">Пользователей</div>
        <div class="value">{{ data.users_count }}</div>
    </div>

    <div class="card">
        <div class="label">Активных заказов</div>
        <div class="value">{{ data.active_orders }}</div>
    </div>

    <div class="card">
        <div class="label">Выручка сегодня</div>
        <div class="value">{{ data.revenue_today }}</div>
    </div>
</div>

</body>
</html>
