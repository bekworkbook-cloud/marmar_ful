<!doctype html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>


    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Outfit', sans-serif; }
        html, body { height: 100%; margin: 0; box-sizing: border-box; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fadeUp .4s ease both; }
        .fade-d1 { animation-delay: .05s; }
        .fade-d2 { animation-delay: .1s; }
        .fade-d3 { animation-delay: .15s; }
        .fade-d4 { animation-delay: .2s; }
        .fade-d5 { animation-delay: .25s; }
        .fade-d6 { animation-delay: .3s; }
        
        .stat-card { transition: transform .2s, box-shadow .2s; }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.3); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .bar { border-radius: 4px 4px 0 0; transition: height .6s ease; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        surface: '#0f172a',
                        card: '#1e293b',
                        accent: '#f59e0b',
                        accentSoft: '#78350f',
                        txt: '#e2e8f0',
                    }
                }
            }
        }

    </script>
    <script src="https://telegram.org/js/telegram-web-app.js">
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">


</head>
<body class="h-full bg-surface text-txt overflow-hidden">
    <div id="app" class="w-full h-full flex flex-col overflow-auto">
        {% block content %}
        {% endblock %}
    </div>
    <script>
      
        lucide.createIcons();
    </script>
    <script src="/static/js/script.js"></script>
</body>
</html>
