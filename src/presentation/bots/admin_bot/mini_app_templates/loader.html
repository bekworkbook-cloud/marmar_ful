{% extends 'base.html' %}

{% block title %}Загрузка...{% endblock %}

{% block content %}
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<div class="flex-1 flex flex-col items-center justify-center h-full fade-up">
    <div class="relative w-16 h-16 mb-6">
        <div class="absolute inset-0 rounded-full border-4 border-white/10"></div>
        <div class="absolute inset-0 rounded-full border-4 border-accent border-t-transparent animate-spin"></div>
    </div>
    
    <h1 class="text-xl font-semibold text-white mb-2">Авторизация...</h1>
    <p class="text-sm text-slate-400">Пожалуйста, подождите, мы проверяем ваши данные.</p>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Извлекаем именно сырую строку данных для проверки подписи
    const initData = tg.initData;

    fetch('/webapp/admin_bot/dashboard', {
        method: 'GET', // Метод должен соответствовать @router.get("/")
        headers: {
            'x-telegram-init-data': initData, // Передаем данные в ожидаемом заголовке
            'Accept': 'text/html'
        }
    })
    .then(response => {
        if (response.ok) {
            // Если проверка прошла, сервер вернет HTML страницы
            return response.text().then(html => {
                document.open();
                document.write(html);
                document.close();
            });
        } else {
            console.error("Ошибка авторизации:", response.status);
            alert("Доступ запрещен или сессия истекла");
        }
    })
    .catch(error => {
        console.error("Ошибка сети:", error);
    });
</script>
{% endblock %}
